version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: usuarios_endereco_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cadastro_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cadastro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
    driver: local

networks:
  app-network:
    driver: bridge